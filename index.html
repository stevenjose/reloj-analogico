<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Robo-Mate - Las Horas</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-wrapper">
        <div class="top-bar">
            <div class="badge">⭐ Puntos: <span id="score">0</span></div>
            <div class="version-badge">🚀 v1.0</div>
            <div class="badge">⏰ Reto: <span id="streak">1</span></div>
        </div>

        <!-- ROBO-MATE -->
        <div class="mascot-stage">
            <div class="robot-3d" id="robo-mate" onclick="robotSpeak('¡Fíjate bien en la aguja pequeña para la hora y en la grande para los minutos!')">
                <div class="robot-antenna"></div>
                <div class="robot-ear left"></div>
                <div class="robot-ear right"></div>
                <div class="robot-head">
                    <div class="robot-screen">
                        <div class="eyes-row"><div class="eye"></div><div class="eye"></div></div>
                        <div class="mouth"><div class="mouth-bar"></div><div class="mouth-bar"></div><div class="mouth-bar"></div></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="speech-bubble" id="robot-speech">
            ¡Hola! Mira las manecillas del reloj analógico y elige la hora digital correcta abajo. ¡Cuidado con el formato de 24 horas!
        </div>

        <!-- RELOJ ANALÓGICO CSS -->
        <div class="clock-container">
            <div class="clock">
                <div class="center-dot"></div>
                <div class="hand hour-hand" id="hour-hand"></div>
                <div class="hand minute-hand" id="min-hand"></div>
                <!-- Marcas de las 12 horas -->
                <span class="number num12">12</span><span class="number num3">3</span>
                <span class="number num6">6</span><span class="number num9">9</span>
            </div>
        </div>

        <!-- OPCIONES DE RESPUESTA -->
        <div class="options-grid" id="options-container">
            <!-- Botones inyectados por JS -->
        </div>

        <div class="feedback-msg" id="feedback"></div>

        <div class="nav-container">
            <a href="https://stevenjose.github.io/3ro-primaria/" class="btn-nav">⬅️ Volver al Portal Principal</a>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
